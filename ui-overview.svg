<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'PingFang SC','Microsoft YaHei',-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .t { font-size: 11px; fill: #64748B; }
      .h { font-size: 13px; font-weight: 700; fill: #1E293B; }
      .label { font-size: 12px; font-weight: 600; fill: #334155; }
      .note { font-size: 10.5px; fill: #94A3B8; }
      .num { font-size: 20px; font-weight: 800; fill: #2563EB; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>
  <text x="600" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#0F172A">LitKG Assistant · 界面结构示意</text>
  <text x="600" y="56" text-anchor="middle" font-size="11.5" fill="#94A3B8">依据 app/main.py 实际 CSS 结构绘制（top-bar / stat-card / upload-zone / paper-card / chat-container），为结构示意，非真实截图</text>

  <!-- ============ LEFT: Dashboard ============ -->
  <rect x="24" y="76" width="676" height="456" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="98" class="label">主界面 · 文献仪表盘</text>

  <!-- top bar -->
  <rect x="40" y="110" width="644" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="54" y="122" width="26" height="18" rx="5" fill="#2563EB"/>
  <text x="90" y="136" class="h" fill="#2563EB">LitKG Assistant</text>
  <rect x="250" y="120" width="220" height="22" rx="11" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="262" y="135" class="note">🔍 搜索论文 / 实体</text>
  <text x="580" y="135" class="note">上传 · 图谱 · 问答</text>

  <!-- dashboard title -->
  <text x="40" y="182" font-size="17" font-weight="700" fill="#1E293B">我的文献库</text>
  <text x="40" y="200" class="note">已解析论文与知识图谱概况</text>

  <!-- stat cards -->
  <g>
    <rect x="40" y="212" width="153" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="62" y="234" font-size="17">📄</text>
    <text x="86" y="240" class="num">12</text>
    <text x="62" y="272" class="t">论文总数</text>

    <rect x="203" y="212" width="153" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="225" y="234" font-size="17">🏷️</text>
    <text x="249" y="240" class="num">348</text>
    <text x="225" y="272" class="t">实体</text>

    <rect x="366" y="212" width="153" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="388" y="234" font-size="17">🔗</text>
    <text x="412" y="240" class="num">1,206</text>
    <text x="388" y="272" class="t">关系</text>

    <rect x="529" y="212" width="155" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="551" y="234" font-size="17">💬</text>
    <text x="575" y="240" class="num">86</text>
    <text x="551" y="272" class="t">问答次数</text>
  </g>

  <!-- upload zone -->
  <rect x="40" y="304" width="644" height="72" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="362" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">⬆ 拖拽或点击上传 PDF 论文</text>
  <text x="362" y="354" text-anchor="middle" class="note">支持批量上传 · Chunk 级 SHA256 增量去重，重复内容不重复计费</text>

  <!-- paper cards -->
  <text x="40" y="402" class="label">最近处理</text>

  <rect x="40" y="412" width="644" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="432" font-size="16">📕</text>
  <text x="82" y="430" class="h">Attention Is All You Need</text>
  <text x="82" y="447" class="note">NeurIPS 2017 · 已构建图谱</text>
  <rect x="596" y="424" width="72" height="22" rx="11" fill="#D1FAE5"/>
  <text x="632" y="439" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065F46">已完成</text>

  <rect x="40" y="466" width="644" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="486" font-size="16">📘</text>
  <text x="82" y="484" class="h">GraphRAG: 图增强检索综述</text>
  <text x="82" y="501" class="note">arXiv 2024 · 正在抽取实体</text>
  <rect x="596" y="478" width="72" height="22" rx="11" fill="#FEF3C7"/>
  <text x="632" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400E">处理中</text>

  <!-- ============ RIGHT: QA ============ -->
  <rect x="720" y="76" width="456" height="456" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="736" y="98" class="label">智能问答 · GraphRAG 融合检索</text>

  <!-- user question -->
  <rect x="812" y="112" width="348" height="50" rx="14" fill="#2563EB"/>
  <text x="830" y="133" font-size="12.5" fill="#EFF6FF" font-weight="600">Transformer 与 BERT 在预训练目标上</text>
  <text x="830" y="151" font-size="12.5" fill="#EFF6FF" font-weight="600">有什么区别？请给出依据。</text>

  <!-- assistant answer -->
  <rect x="736" y="178" width="348" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="754" y="200" class="h">💬 回答（向量 + 图谱融合）</text>
  <text x="754" y="222" class="t">Transformer 使用自回归语言建模，</text>
  <text x="754" y="240" class="t">而 BERT 采用掩码语言建模（MLM）…</text>
  <text x="754" y="258" class="t">图谱检索到两者共享「自注意力」实体，</text>
  <text x="754" y="276" class="t">但预训练目标节点不同。</text>
  <line x1="754" y1="290" x2="1068" y2="290" stroke="#E2E8F0"/>
  <text x="754" y="310" font-size="10.5" font-weight="700" fill="#475569">🔗 Triple 溯源依据</text>

  <!-- evidence chips -->
  <rect x="754" y="320" width="180" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="844" y="337" text-anchor="middle" font-size="10.5" fill="#1D4ED8">(BERT) —[使用]→ (MLM)</text>

  <rect x="944" y="320" width="124" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="1006" y="337" text-anchor="middle" font-size="10.5" fill="#1D4ED8">(Transformer) —[使用]→ (自回归)</text>

  <rect x="754" y="454" width="150" height="26" rx="13" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="829" y="471" text-anchor="middle" font-size="10.5" fill="#92400E">⚠ 低置信结论标注「待验证」</text>

  <!-- footer legend -->
  <text x="736" y="506" class="note">答案可追溯到具体三元组（Triple），低置信度结论自动标注，避免幻觉</text>
</svg>
